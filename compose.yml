version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_taller
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_taller
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - db